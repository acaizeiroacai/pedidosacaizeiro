<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Açaizeiro - Gestão Operacional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url("https://db.onlinewebfonts.com/c/20e48b2ec8c64b2a1ceb5b28d9bcc9d0?family=Bryndan+Write");
    .fonte-bryndan { font-family: "Bryndan Write", cursive, sans-serif; letter-spacing: 1px; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen">

  <!-- Ecrã de Bloqueio por Senha -->
  <div id="tela-login" class="fixed inset-0 bg-[#411564] z-50 flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-xs text-center space-y-4">
      <div class="w-16 h-16 rounded-full bg-black mx-auto flex items-center justify-center overflow-hidden border-2 border-purple-300">
        <img src="LOGO2.png" alt="Açaizeiro" class="w-full h-full object-contain p-1" onerror="this.onerror=null; this.src='PURO.png';">
      </div>
      <div>
        <h2 class="fonte-bryndan text-2xl font-bold text-[#411564]">AÇAIZEIRO</h2>
        <p class="text-xs text-gray-500 font-medium mt-0.5">Acesso Restrito da Gerência</p>
      </div>

      <div class="space-y-3">
        <input type="password" id="campo-senha" placeholder="Digite a Senha" class="w-full text-center text-lg font-bold tracking-widest border border-gray-300 rounded-xl p-3 outline-purple-600">
        <p id="erro-senha" class="text-xs text-red-600 font-semibold hidden">Palavra-passe incorreta!</p>
        <button type="button" id="btn-entrar" onclick="tentarEntrar()" class="w-full bg-[#411564] hover:bg-purple-900 text-white font-bold py-3 rounded-xl transition active:scale-95 text-sm shadow-md cursor-pointer">
          Entrar no Painel
        </button>
      </div>
    </div>
  </div>

  <!-- Conteúdo Principal do Admin -->
  <div id="painel-conteudo" class="hidden">
    <!-- Topo / Cabeçalho -->
    <header class="bg-[#411564] text-white p-4 shadow-md sticky top-0 z-30">
      <div class="max-w-5xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-black flex items-center justify-center overflow-hidden border border-purple-300">
            <img src="LOGO2.png" alt="Açaizeiro" class="w-full h-full object-contain p-0.5" onerror="this.onerror=null; this.src='PURO.png';">
          </div>
          <div>
            <h1 class="fonte-bryndan text-xl font-bold tracking-wide">AÇAIZEIRO - GESTÃO</h1>
            <p class="text-[11px] text-purple-200">Painel Operacional e Estoque</p>
          </div>
        </div>
        <!-- Alternador de Abas, Som e Logout -->
        <div class="flex gap-2 items-center">
          <button onclick="alternarSom()" id="btn-som" class="bg-purple-950/60 hover:bg-purple-900 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer" title="Ativar/Desativar som de alerta">
            <i id="icone-som" class="fa-solid fa-volume-high"></i>
          </button>
          <button onclick="mudarAba('pedidos')" id="tab-btn-pedidos" class="bg-purple-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer">Pedidos</button>
          <button onclick="mudarAba('stock')" id="tab-btn-stock" class="bg-purple-950/60 hover:bg-purple-900 text-purple-200 px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer">Estoque</button>
          <button onclick="carregarPedidos()" class="bg-purple-800 hover:bg-purple-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer" title="Atualizar dados"><i class="fa-solid fa-rotate-right"></i></button>
          <button onclick="sairPainel()" class="bg-red-800 hover:bg-red-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer" title="Sair do painel"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </header>

    <!-- ABA 1: PEDIDOS -->
    <section id="aba-pedidos" class="max-w-5xl mx-auto p-4">
      <div class="flex gap-2 overflow-x-auto pb-3">
        <button onclick="filtrarStatus('Todos')" class="btn-filtro px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#411564] text-white cursor-pointer" data-status="Todos">Todos</button>
        <button onclick="filtrarStatus('Aguardando Aceite da Loja')" class="btn-filtro px-3.5 py-1.5 rounded-full text-xs font-bold bg-white text-gray-700 border hover:bg-gray-50 cursor-pointer" data-status="Aguardando Aceite da Loja">Novos (Aguardando Aceite)</button>
        <button onclick="filtrarStatus('Aguardando Pagamento Pix')" class="btn-filtro px-3.5 py-1.5 rounded-full text-xs font-bold bg-white text-gray-700 border hover:bg-gray-50 cursor-pointer" data-status="Aguardando Pagamento Pix">Aguardando Pix</button>
        <button onclick="filtrarStatus('Em preparo')" class="btn-filtro px-3.5 py-1.5 rounded-full text-xs font-bold bg-white text-gray-700 border hover:bg-gray-50 cursor-pointer" data-status="Em preparo">Em Preparação</button>
        <button onclick="filtrarStatus('Saiu para entrega')" class="btn-filtro px-3.5 py-1.5 rounded-full text-xs font-bold bg-white text-gray-700 border hover:bg-gray-50 cursor-pointer" data-status="Saiu para entrega">A Caminho</button>
        <button onclick="filtrarStatus('Concluído')" class="btn-filtro px-3.5 py-1.5 rounded-full text-xs font-bold bg-white text-gray-700 border hover:bg-gray-50 cursor-pointer" data-status="Concluído">Concluídos</button>
        <button onclick="filtrarStatus('Recusado')" class="btn-filtro px-3.5 py-1.5 rounded-full text-xs font-bold bg-white text-gray-700 border hover:bg-gray-50 cursor-pointer" data-status="Recusado">Recusados</button>
      </div>
      <div id="lista-pedidos-admin" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="col-span-full text-center py-12 text-gray-400 text-sm">Carregando pedidos...</div>
      </div>
    </section>

    <!-- ABA 2: ESTOQUE -->
    <section id="aba-stock" class="max-w-5xl mx-auto p-4 hidden">
      <div class="bg-white p-5 rounded-2xl shadow-sm mb-6 border border-gray-200">
        <h2 class="text-base font-extrabold text-[#411564] mb-3 flex items-center gap-2">
          <i class="fa-solid fa-mug-hot"></i> Copos do Cardápio
        </h2>
        <div id="lista-copos-stock" class="divide-y divide-gray-100">
          <p class="text-xs text-gray-400 py-4 text-center">Carregando copos...</p>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
        <h2 class="text-base font-extrabold text-[#411564] mb-3 flex items-center gap-2">
          <i class="fa-solid fa-bowl-food"></i> Frutas e Complementos
        </h2>
        <div id="lista-complementos-stock" class="divide-y divide-gray-100">
          <p class="text-xs text-gray-400 py-4 text-center">Carregando complementos...</p>
        </div>
      </div>
    </section>
  </div>

  <script>
    var SENHA_MESTRA = "3944";
    var somAtivo = true;
    var intervaloCampainha = null;
    var audioCtx = null;

    function obterAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function emitirBipeDelivery() {
      if (!somAtivo) return;
      try {
        var ctx = obterAudioContext();
        var agora = ctx.currentTime;

        // 1º Toque do Sino (F#6 - 1480Hz)
        var osc1 = ctx.createOscillator();
        var gain1 = ctx.createGain();
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(1479.98, agora);
        
        gain1.gain.setValueAtTime(0.5, agora);
        gain1.gain.exponentialRampToValueAtTime(0.001, agora + 0.35); // Ressonância metálica
        
        osc1.start(agora);
        osc1.stop(agora + 0.35);

        // 2º Toque do Sino (A6 - 1760Hz, mais agudo)
        var osc2 = ctx.createOscillator();
        var gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(1760.00, agora + 0.18);
        
        gain2.gain.setValueAtTime(0.6, agora + 0.18);
        gain2.gain.exponentialRampToValueAtTime(0.001, agora + 0.75); // Sustentação mais longa
        
        osc2.start(agora + 0.18);
        osc2.stop(agora + 0.75);

      } catch (e) {
        console.warn("Áudio:", e);
      }
    }

    function iniciarAlarmeSonoro() {
      if (intervaloCampainha) return;
      emitirBipeDelivery();
      intervaloCampainha = setInterval(function() {
        emitirBipeDelivery();
      }, 2500);
    }

    function pararAlarmeSonoro() {
      if (intervaloCampainha) {
        clearInterval(intervaloCampainha);
        intervaloCampainha = null;
      }
    }

    function alternarSom() {
      somAtivo = !somAtivo;
      var icone = document.getElementById('icone-som');
      if (icone) {
        icone.className = somAtivo ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
      }
      if (!somAtivo) {
        pararAlarmeSonoro();
      }
    }

    function tentarEntrar() {
      var campo = document.getElementById('campo-senha');
      var erro = document.getElementById('erro-senha');
      if (!campo) return;

      var valorDigitado = campo.value.trim();

      if (valorDigitado === SENHA_MESTRA) {
        obterAudioContext();
        sessionStorage.setItem('admin_acaizeiro_auth', 'true');
        liberarAcesso();
      } else {
        erro.classList.remove('hidden');
        campo.value = "";
      }
    }

    function liberarAcesso() {
      var tela = document.getElementById('tela-login');
      var painel = document.getElementById('painel-conteudo');

      if (tela) tela.classList.add('hidden');
      if (painel) painel.classList.remove('hidden');

      carregarPedidos();
      setInterval(carregarPedidos, 10000);
    }

    function verificarAutenticacao() {
      if (sessionStorage.getItem('admin_acaizeiro_auth') === 'true') {
        liberarAcesso();
      }
    }

    function sairPainel() {
      sessionStorage.removeItem('admin_acaizeiro_auth');
      location.reload();
    }

    // SUPABASE E GESTÃO
    var SUPABASE_URL = "https://sfxvbnxswuvkpssnryjk.supabase.co";
    var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeHZibnhzd3V2a3Bzc25yeWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MjE5OTMsImV4cCI6MjEwOTE5Nzk5M30.lCnXsUM9vzUmDOytZOMNJsOYqkc-pX0zvuVLGHfpkBE";
    var client = null;

    var listaGlobalPedidos = [];
    var statusSelecionado = 'Todos';

    function initClient() {
      if (!client && window.supabase && window.supabase.createClient) {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return client;
    }

    function mudarAba(aba) {
      ['pedidos', 'stock'].forEach(function(a) {
        document.getElementById('aba-' + a).classList.add('hidden');
        document.getElementById('tab-btn-' + a).className = "bg-purple-950/60 hover:bg-purple-900 text-purple-200 px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer";
      });
      document.getElementById('aba-' + aba).classList.remove('hidden');
      document.getElementById('tab-btn-' + aba).className = "bg-purple-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer";

      if (aba === 'stock') carregarStock();
    }

    async function carregarPedidos() {
      var sb = initClient();
      if (!sb) {
        setTimeout(carregarPedidos, 500);
        return;
      }

      try {
        var res = await sb.from('pedidos').select('*').order('id', { ascending: false }).limit(50);
        if (res.error) {
          console.error("Erro ao procurar pedidos:", res.error);
          document.getElementById('lista-pedidos-admin').innerHTML = '<div class="col-span-full text-center py-8 text-red-500 text-sm">Erro ao carregar: ' + res.error.message + '</div>';
          return;
        }

        listaGlobalPedidos = res.data || [];
        renderizarPedidos();
      } catch (err) {
        console.error("Erro inesperado:", err);
      }
    }

    function filtrarStatus(s) {
      statusSelecionado = s;
      document.querySelectorAll('.btn-filtro').forEach(function(b) {
        b.className = b.getAttribute('data-status') === s 
          ? "btn-filtro px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#411564] text-white cursor-pointer"
          : "btn-filtro px-3.5 py-1.5 rounded-full text-xs font-bold bg-white text-gray-700 border hover:bg-gray-50 cursor-pointer";
      });
      renderizarPedidos();
    }

    function renderizarPedidos() {
      var container = document.getElementById('lista-pedidos-admin');
      var filtrados = statusSelecionado === 'Todos' 
        ? listaGlobalPedidos 
        : listaGlobalPedidos.filter(function(p) { return p.status === statusSelecionado; });

      if (filtrados.length === 0) {
        container.innerHTML = '<div class="col-span-full bg-white p-8 rounded-xl shadow-sm text-center text-gray-400 text-sm">Nenhum pedido encontrado.</div>';
        pararAlarmeSonoro();
        return;
      }

      var temPendente = false;

      container.innerHTML = filtrados.map(function(p) {
        var hora = p.created_at ? new Date(p.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
        var itensHtml = '';
        if (Array.isArray(p.itens)) {
          itensHtml = p.itens.map(function(i) {
            var compl = (i.complementos && i.complementos.length > 0) ? '<p class="text-[11px] text-purple-700 pl-2">+ ' + i.complementos.join(', ') + '</p>' : '';
            var obs = i.observacao ? '<p class="text-[11px] text-gray-500 italic pl-2">Obs: ' + i.observacao + '</p>' : '';
            return '<div class="text-xs py-1 border-b border-gray-50">' +
              '<span class="font-bold text-gray-900">' + i.quantidade + 'x ' + i.nome + '</span>' +
              compl + obs +
            '</div>';
          }).join('');
        }

        var isAguardandoAceite = (p.status === 'Aguardando Aceite da Loja' || p.status === 'Recebido');
        if (isAguardandoAceite) temPendente = true;

        var badge = "bg-amber-100 text-amber-800 border-amber-200";
        if (isAguardandoAceite) badge = "bg-amber-100 text-amber-800 border-amber-300 animate-pulse font-black";
        if (p.status === "Aguardando Pagamento Pix") badge = "bg-blue-100 text-blue-800 border-blue-200";
        if (p.status === "Em preparo") badge = "bg-purple-100 text-purple-800 border-purple-200 font-bold";
        if (p.status === "Saiu para entrega") badge = "bg-indigo-100 text-indigo-800 border-indigo-200";
        if (p.status === "Concluído") badge = "bg-green-100 text-green-800 border-green-200";
        if (p.status === "Recusado") badge = "bg-rose-100 text-rose-800 border-rose-200";

        var obsGeral = p.observacoes ? '<p class="text-xs text-red-600 bg-red-50 p-2 rounded-lg font-medium mb-2">Obs: ' + p.observacoes + '</p>' : '';

        // Botões de Ação
        var botoesHtml = '';
        if (isAguardandoAceite) {
          botoesHtml = 
            '<div class="grid grid-cols-2 gap-2">' +
              '<button onclick="aceitarPedido(' + p.id + ', \'' + (p.forma_pagamento || '') + '\')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs py-2 rounded-lg shadow transition active:scale-95 flex items-center justify-center gap-1 cursor-pointer">' +
                '<i class="fa-solid fa-check"></i> Aceitar Pedido' +
              '</button>' +
              '<button onclick="recusarPedido(' + p.id + ')" class="bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs py-2 rounded-lg border border-rose-200 transition active:scale-95 cursor-pointer">' +
                '<i class="fa-solid fa-xmark"></i> Recusar' +
              '</button>' +
            '</div>';
        } else if (p.status === "Aguardando Pagamento Pix") {
          botoesHtml = 
            '<div class="text-center py-1 text-xs text-blue-700 font-semibold bg-blue-50 rounded-lg border border-blue-100">' +
              'Aguardando o cliente pagar o Pix no site...' +
            '</div>';
        } else {
          botoesHtml = 
            '<div class="grid grid-cols-3 gap-1.5">' +
              '<button onclick="mudarStatus(' + p.id + ', \'Em preparo\')" class="bg-purple-50 hover:bg-purple-100 text-purple-700 text-[11px] font-bold py-1.5 rounded-lg border border-purple-200 transition active:scale-95 cursor-pointer">Preparo</button>' +
              '<button onclick="mudarStatus(' + p.id + ', \'Saiu para entrega\')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[11px] font-bold py-1.5 rounded-lg border border-indigo-200 transition active:scale-95 cursor-pointer">A Caminho</button>' +
              '<button onclick="mudarStatus(' + p.id + ', \'Concluído\')" class="bg-green-50 hover:bg-green-100 text-green-700 text-[11px] font-bold py-1.5 rounded-lg border border-green-200 transition active:scale-95 cursor-pointer">Concluído</button>' +
            '</div>';
        }

        return '<div class="bg-white rounded-2xl p-4 shadow-sm border ' + (isAguardandoAceite ? 'border-amber-400 ring-2 ring-amber-300' : 'border-gray-200') + ' flex flex-col justify-between">' +
          '<div>' +
            '<div class="flex justify-between items-start mb-2">' +
              '<div>' +
                '<span class="text-xs font-bold text-purple-900">#' + p.id + '</span>' +
                '<span class="text-[11px] text-gray-400 ml-1.5">' + hora + '</span>' +
                '<h3 class="font-extrabold text-gray-900 text-base leading-tight">' + (p.cliente_nome || 'Cliente') + '</h3>' +
              '</div>' +
              '<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border ' + badge + '">' + p.status + '</span>' +
            '</div>' +
            '<p class="text-xs text-gray-600 mb-2 flex items-start gap-1">' +
              '<i class="fa-solid fa-location-dot mt-0.5 text-gray-400"></i>' +
              '<span>' + (p.cliente_endereco || 'Não informado') + '</span>' +
            '</p>' +
            '<div class="bg-gray-50 p-2.5 rounded-xl my-2 max-h-36 overflow-y-auto">' + itensHtml + '</div>' +
            obsGeral +
          '</div>' +
          '<div class="pt-3 border-t mt-2">' +
            '<div class="flex justify-between items-center mb-3">' +
              '<span class="text-xs text-gray-500">Pagamento: <strong>' + (p.forma_pagamento || '-') + '</strong></span>' +
              '<span class="text-base font-black text-[#411564]">R$ ' + Number(p.total || 0).toFixed(2).replace('.', ',') + '</span>' +
            '</div>' +
            botoesHtml +
          '</div>' +
        '</div>';
      }).join('');

      if (temPendente) {
        iniciarAlarmeSonoro();
      } else {
        pararAlarmeSonoro();
      }
    }

    async function aceitarPedido(id, formaPagamento) {
      var isPix = formaPagamento && formaPagamento.toLowerCase().indexOf('pix') !== -1;
      var novoStatus = isPix ? 'Aguardando Pagamento Pix' : 'Em preparo';

      var sb = initClient();
      var res = await sb.from('pedidos').update({ status: novoStatus }).eq('id', id);
      if (res.error) {
        alert("Erro ao aceitar pedido: " + res.error.message);
        return;
      }
      var p = listaGlobalPedidos.find(function(x) { return x.id === id; });
      if (p) p.status = novoStatus;
      renderizarPedidos();
    }

    async function recusarPedido(id) {
      if (!confirm("Tem certeza que deseja recusar este pedido? O cliente será avisado imediatamente no site.")) return;

      var sb = initClient();
      var res = await sb.from('pedidos').update({ status: 'Recusado' }).eq('id', id);
      if (res.error) {
        alert("Erro ao recusar pedido: " + res.error.message);
        return;
      }
      var p = listaGlobalPedidos.find(function(x) { return x.id === id; });
      if (p) p.status = 'Recusado';
      renderizarPedidos();
    }

    async function mudarStatus(id, st) {
      var sb = initClient();
      await sb.from('pedidos').update({ status: st }).eq('id', id);
      var p = listaGlobalPedidos.find(function(x) { return x.id === id; });
      if (p) p.status = st;
      renderizarPedidos();
    }

    async function carregarStock() {
      var sb = initClient();
      var rCopos = await sb.from('CARDAPIO ACAIZEIRO').select('*').order('id');
      var rComp = await sb.from('COMPLEMENTOS').select('*').order('nome');

      var cCopos = document.getElementById('lista-copos-stock');
      if (rCopos.data && rCopos.data.length > 0) {
        cCopos.innerHTML = rCopos.data.map(function(copo) {
          var disponivel = copo.ativo !== false;
          var btnClasse = disponivel ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-red-100 text-red-800 border border-red-300';
          return '<div class="py-2.5 flex items-center justify-between">' +
            '<div>' +
              '<p class="text-sm font-bold text-gray-800">' + copo.nome + '</p>' +
              '<p class="text-xs text-gray-400">' + (copo.categoria || '') + ' — R$ ' + Number(copo.preco).toFixed(2).replace('.', ',') + '</p>' +
            '</div>' +
            '<button onclick="toggleItem(\'CARDAPIO ACAIZEIRO\', ' + copo.id + ', ' + disponivel + ')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition active:scale-95 cursor-pointer ' + btnClasse + '">' +
              (disponivel ? 'Disponível' : 'Esgotado') +
            '</button>' +
          '</div>';
        }).join('');
      } else {
        cCopos.innerHTML = '<p class="text-xs text-gray-400 py-2">Nenhum copo registado.</p>';
      }

      var cComp = document.getElementById('lista-complementos-stock');
      if (rComp.data && rComp.data.length > 0) {
        cComp.innerHTML = rComp.data.map(function(comp) {
          var disponivel = comp.ativo !== false;
          var btnClasse = disponivel ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-red-100 text-red-800 border border-red-300';
          return '<div class="py-2.5 flex items-center justify-between">' +
            '<div>' +
              '<p class="text-sm font-bold text-gray-800">' + comp.nome + '</p>' +
              '<p class="text-xs text-gray-400">+ R$ ' + Number(comp.preco).toFixed(2).replace('.', ',') + '</p>' +
            '</div>' +
            '<button onclick="toggleItem(\'COMPLEMENTOS\', \'' + comp.id + '\', ' + disponivel + ')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition active:scale-95 cursor-pointer ' + btnClasse + '">' +
              (disponivel ? 'Disponível' : 'Esgotado') +
            '</button>' +
          '</div>';
        }).join('');
      } else {
        cComp.innerHTML = '<p class="text-xs text-gray-400 py-2">Nenhum complemento registado.</p>';
      }
    }

    async function toggleItem(tabela, id, ativoAtual) {
      var sb = initClient();
      await sb.from(tabela).update({ ativo: !ativoAtual }).eq('id', id);
      carregarStock();
    }

    window.addEventListener('DOMContentLoaded', function() {
      var campo = document.getElementById('campo-senha');
      if (campo) {
        campo.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            tentarEntrar();
          }
        });
      }
      verificarAutenticacao();
    });
  </script>
</body>
</html>
