<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Online & Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 pb-28">

  <!-- Cabeçalho -->
  <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-30 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Nosso Cardápio</h1>
      <p class="text-xs text-emerald-100 flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-green-300 inline-block animate-pulse"></span> Aberto para pedidos
      </p>
    </div>
    <button onclick="abrirConfig()" class="text-emerald-100 hover:text-white p-2 text-sm bg-emerald-700/60 rounded-full" title="Configurar Loja">
      <i class="fa-solid fa-gear"></i>
    </button>
  </header>

  <!-- Lista de Produtos -->
  <main class="max-w-xl mx-auto p-4 space-y-4" id="lista-produtos">
    <!-- Itens inseridos via script -->
  </main>

  <!-- Barra Fixa do Carrinho -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-2xl z-30">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-500">Total do pedido</p>
        <p class="text-xl font-extrabold text-emerald-700" id="total-barra">R$ 0,00</p>
      </div>
      <button onclick="abrirModalCheckout()" id="btn-sacola" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-xl flex items-center gap-2 shadow-md transition disabled:opacity-50" disabled>
        <i class="fa-solid fa-basket-shopping"></i>
        <span>Ver Sacola (<span id="qtd-itens">0</span>)</span>
      </button>
    </div>
  </footer>

  <!-- Modal do Checkout / Pedido -->
  <div id="modal-checkout" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="text-lg font-bold text-gray-800">Finalizar Pedido</h2>
        <button onclick="fecharModalCheckout()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <div id="itens-carrinho" class="divide-y text-sm max-h-48 overflow-y-auto"></div>

      <div class="bg-gray-50 p-3 rounded-lg space-y-1 text-sm">
        <div class="flex justify-between text-gray-600">
          <span>Subtotal:</span>
          <span id="resumo-subtotal">R$ 0,00</span>
        </div>
        <div class="flex justify-between text-gray-600">
          <span>Taxa de Entrega:</span>
          <span id="resumo-taxa">R$ 0,00</span>
        </div>
        <div class="flex justify-between font-bold text-base text-gray-900 border-t pt-1">
          <span>Total Geral:</span>
          <span id="resumo-total">R$ 0,00</span>
        </div>
      </div>

      <!-- Formulário de Entrega -->
      <form id="form-pedido" class="space-y-3" onsubmit="enviarPedido(event)">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Seu Nome *</label>
          <input type="text" id="cliente-nome" required class="w-full border rounded-lg p-2.5 text-sm outline-emerald-600" placeholder="Ex: Maria Oliveira">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Endereço de Entrega (Rua, Número, Bairro) *</label>
          <input type="text" id="cliente-endereco" required class="w-full border rounded-lg p-2.5 text-sm outline-emerald-600" placeholder="Rua das Flores, 123 - Centro">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Forma de Pagamento *</label>
          <select id="forma-pagamento" class="w-full border rounded-lg p-2.5 text-sm outline-emerald-600">
            <option value="Pix">Pix (Chave informada no zap)</option>
            <option value="Cartão de Crédito/Débito">Cartão de Crédito/Débito (Levar maquininha)</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Observações do Pedido</label>
          <textarea id="cliente-obs" rows="2" class="w-full border rounded-lg p-2 text-sm outline-emerald-600" placeholder="Ex: Tirar cebola, campainha não funciona..."></textarea>
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 transition">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span>Enviar Pedido pelo WhatsApp</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // 1. CONFIGURAÇÕES DA LOJA (Altere aqui se desejar ou pelo ícone de engrenagem)
    let config = {
      whatsapp: "5511999999999", // Coloque: 55 + DDD + Telefone sem traços
      taxaEntrega: 5.00
    };

    // 2. SEU CARDÁPIO (Basta adicionar ou editar os itens abaixo)
    const produtos = [
      { id: 1, nome: "Açaí Tradicional 500ml", desc: "Acompanha banana fatiada, leite em pó e granola crocante.", preco: 22.00 },
      { id: 2, nome: "Açaí Especial Trufado 500ml", desc: "Camadas generosas de Nutella, morangos frescos e leite condensado.", preco: 27.50 },
      { id: 3, nome: "Copo da Felicidade 400ml", desc: "Brigadeiro gourmet, morango picado, brownie e raspas de chocolate.", preco: 19.90 },
      { id: 4, nome: "Água Mineral 500ml", desc: "Sem gás, bem gelada.", preco: 4.50 }
    ];

    let carrinho = {};

    function carregarProdutos() {
      const container = document.getElementById('lista-produtos');
      container.innerHTML = produtos.map(prod => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between gap-4 items-center">
          <div class="flex-1">
            <h3 class="font-bold text-gray-900">${prod.nome}</h3>
            <p class="text-xs text-gray-500 mt-1 line-clamp-2">${prod.desc}</p>
            <span class="inline-block mt-2 font-bold text-emerald-700">R$ ${prod.preco.toFixed(2).replace('.', ',')}</span>
          </div>
          <div>
            <button onclick="adicionarAoCarrinho(${prod.id})" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold px-4 py-2 rounded-lg border border-emerald-200 text-sm active:scale-95 transition">
              Adicionar
            </button>
          </div>
        </div>
      `).join('');
    }

    function adicionarAoCarrinho(id) {
      carrinho[id] = (carrinho[id] || 0) + 1;
      atualizarBarra();
    }

    function alterarQtd(id, delta) {
      if (!carrinho[id]) return;
      carrinho[id] += delta;
      if (carrinho[id] <= 0) delete carrinho[id];
      atualizarBarra();
      renderizarItensCheckout();
    }

    function calcularTotais() {
      let subtotal = 0;
      let totalQtd = 0;
      for (const id in carrinho) {
        const prod = produtos.find(p => p.id == id);
        if (prod) {
          subtotal += prod.preco * carrinho[id];
          totalQtd += carrinho[id];
        }
      }
      const total = subtotal > 0 ? (subtotal + config.taxaEntrega) : 0;
      return { subtotal, total, totalQtd };
    }

    function atualizarBarra() {
      const { subtotal, totalQtd } = calcularTotais();
      document.getElementById('total-barra').innerText = `R$ ${subtotal.toFixed(2).replace('.', ',')}`;
      document.getElementById('qtd-itens').innerText = totalQtd;
      document.getElementById('btn-sacola').disabled = totalQtd === 0;
    }

    function renderizarItensCheckout() {
      const { subtotal, total } = calcularTotais();
      const container = document.getElementById('itens-carrinho');
      
      const itensHtml = Object.keys(carrinho).map(id => {
        const prod = produtos.find(p => p.id == id);
        const qtd = carrinho[id];
        return `
          <div class="flex justify-between items-center py-2">
            <div>
              <p class="font-medium text-gray-800">${prod.nome}</p>
              <p class="text-xs text-gray-500">R$ ${prod.preco.toFixed(2).replace('.', ',')} un.</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="alterarQtd(${prod.id}, -1)" class="w-6 h-6 rounded bg-gray-100 hover:bg-gray-200 font-bold text-gray-700">-</button>
              <span class="font-semibold text-sm w-4 text-center">${qtd}</span>
              <button onclick="alterarQtd(${prod.id}, 1)" class="w-6 h-6 rounded bg-gray-100 hover:bg-gray-200 font-bold text-gray-700">+</button>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = itensHtml || '<p class="text-center py-4 text-gray-400">Sacola vazia</p>';
      document.getElementById('resumo-subtotal').innerText = `R$ ${subtotal.toFixed(2).replace('.', ',')}`;
      document.getElementById('resumo-taxa').innerText = `R$ ${config.taxaEntrega.toFixed(2).replace('.', ',')}`;
      document.getElementById('resumo-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    function abrirModalCheckout() {
      renderizarItensCheckout();
      document.getElementById('modal-checkout').classList.remove('hidden');
    }

    function fecharModalCheckout() {
      document.getElementById('modal-checkout').classList.add('hidden');
    }

    function abrirConfig() {
      const novoZap = prompt("Digite seu WhatsApp com DDD (somente números, ex: 5511999999999):", config.whatsapp);
      if (novoZap) config.whatsapp = novoZap.replace(/\D/g, '');
      const novaTaxa = prompt("Digite a taxa de entrega padrão (ex: 5.00):", config.taxaEntrega);
      if (novaTaxa) config.taxaEntrega = parseFloat(novaTaxa) || 0;
      atualizarBarra();
    }

    function enviarPedido(e) {
      e.preventDefault();
      const nome = document.getElementById('cliente-nome').value.trim();
      const endereco = document.getElementById('cliente-endereco').value.trim();
      const pagamento = document.getElementById('forma-pagamento').value;
      const obs = document.getElementById('cliente-obs').value.trim();
      const { subtotal, total } = calcularTotais();

      let texto = `*🛍️ NOVO PEDIDO RECEBIDO!*\n\n`;
      texto += `*Cliente:* ${nome}\n`;
      texto += `*Endereço:* ${endereco}\n`;
      texto += `*Pagamento:* ${pagamento}\n`;
      if (obs) texto += `*Obs:* ${obs}\n`;
      texto += `\n*📋 ITENS DO PEDIDO:*\n`;

      for (const id in carrinho) {
        const prod = produtos.find(p => p.id == id);
        const qtd = carrinho[id];
        const subItem = prod.preco * qtd;
        texto += `• ${qtd}x ${prod.nome} — R$ ${subItem.toFixed(2).replace('.', ',')}\n`;
      }

      texto += `\n*Taxa de entrega:* R$ ${config.taxaEntrega.toFixed(2).replace('.', ',')}\n`;
      texto += `*Total final:* R$ ${total.toFixed(2).replace('.', ',')}\n`;

      const linkWhatsapp = `https://wa.me/${config.whatsapp}?text=${encodeURIComponent(texto)}`;
      window.open(linkWhatsapp, '_blank');
    }

    carregarProdutos();
  </script>
</body>
</html>
