<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Açaizeiro - Delivery de Açaí</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-purple-50 text-gray-800 pb-28 antialiased">

  <!-- Topo / Cabeçalho -->
  <header class="bg-gradient-to-r from-purple-900 via-purple-800 to-indigo-950 text-white p-4 shadow-lg sticky top-0 z-30">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="logo.jpg" alt="Açaizeiro" class="w-12 h-12 rounded-full object-cover border-2 border-purple-300 shadow-md">
        <div>
          <h1 class="text-lg font-black tracking-tight leading-tight">Açaizeiro</h1>
          <p class="text-xs text-purple-200 flex items-center gap-1.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span> Aberto para Pedidos
          </p>
        </div>
      </div>
      <button onclick="abrirConfig()" class="text-purple-200 hover:text-white p-2 text-base bg-purple-800/80 rounded-xl border border-purple-700" title="Configurar Loja">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <!-- Filtro de Categorias -->
  <nav class="max-w-xl mx-auto px-4 pt-3 pb-1 sticky top-[69px] bg-purple-50/95 backdrop-blur-sm z-20">
    <div class="flex gap-2 overflow-x-auto hide-scrollbar py-1" id="lista-categorias"></div>
  </nav>

  <!-- Lista de Itens -->
  <main class="max-w-xl mx-auto p-4 space-y-3" id="lista-produtos"></main>

  <!-- Barra Fixa Inferior (Sacola) -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-purple-100 p-3.5 shadow-2xl z-30">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-[11px] text-gray-500 uppercase font-semibold">Total do Pedido</p>
        <p class="text-xl font-black text-purple-900" id="total-barra">R$ 0,00</p>
      </div>
      <button onclick="abrirModalCheckout()" id="btn-sacola" class="bg-purple-700 hover:bg-purple-800 active:scale-95 text-white font-bold px-5 py-3 rounded-xl flex items-center gap-2.5 shadow-md shadow-purple-900/20 transition disabled:opacity-40 disabled:pointer-events-none">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Ver Sacola (<span id="qtd-itens">0</span>)</span>
      </button>
    </div>
  </footer>

  <!-- Modal Checkout -->
  <div id="modal-checkout" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="text-lg font-black text-purple-950 flex items-center gap-2">
          <i class="fa-solid fa-receipt text-purple-700"></i> Finalizar Pedido
        </h2>
        <button onclick="fecharModalCheckout()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div id="itens-carrinho" class="divide-y divide-gray-100 text-sm max-h-44 overflow-y-auto pr-1"></div>

      <div class="bg-purple-50/70 p-3.5 rounded-xl space-y-1.5 text-sm border border-purple-100">
        <div class="flex justify-between text-gray-600">
          <span>Subtotal:</span>
          <span id="resumo-subtotal" class="font-semibold">R$ 0,00</span>
        </div>
        <div class="flex justify-between text-gray-600">
          <span>Taxa de Entrega:</span>
          <span id="resumo-taxa" class="font-semibold">R$ 0,00</span>
        </div>
        <div class="flex justify-between font-black text-base text-purple-950 border-t border-purple-200/80 pt-2">
          <span>Total Geral:</span>
