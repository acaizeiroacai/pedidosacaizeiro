<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Açaizeiro - Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#fcfaff] text-gray-800 pb-28 antialiased">

  <!-- Topo -->
  <header class="bg-[#5c1380] text-white p-4 shadow-md sticky top-0 z-30">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <!-- Logotipo oficial -->
        <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center overflow-hidden border-2 border-purple-300 shadow-md flex-shrink-0">
          <img src="LOGOO.png" alt="Açaizeiro" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span style="display:none;" class="text-xl">🍇</span>
        </div>
        <div>
          <h1 class="text-lg font-black tracking-tight leading-tight">Açaizeiro</h1>
          <p class="text-xs text-purple-200 flex items-center gap-1.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-green-400 inline-block animate-pulse"></span> Aberto para Pedidos
          </p>
        </div>
      </div>
      <button onclick="abrirConfig()" class="text-purple-200 hover:text-white p-2 text-base bg-purple-900/60 rounded-xl" title="Configurar Loja">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <!-- Filtro de Categorias -->
  <nav class="max-w-xl mx-auto px-4 pt-4 pb-2 sticky top-[73px] bg-[#fcfaff]/95 backdrop-blur-sm z-20">
    <div class="flex gap-2 overflow-x-auto hide-scrollbar py-1" id="lista-categorias"></div>
  </nav>

  <!-- Lista de Itens -->
  <main class="max-w-xl mx-auto p-4 space-y-3" id="lista-produtos"></main>

  <!-- Barra Fixa Inferior (Sacola) -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-purple-100 p-3.5 shadow-2xl z-30">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-[11px] text-gray-500 uppercase font-semibold">Total do Pedido</p>
        <p class="text-xl font-black text-[#5c1380]" id="total-barra">R$ 0,00</p>
      </div>
      <button onclick="abrirModalCheckout()" id="btn-sacola" class="bg-[#5c1380] hover:bg-purple-900 active:scale-95 text-white font-bold px-5 py-3 rounded-xl flex items-center gap-2.5 shadow-md transition disabled:opacity-40 disabled:pointer-events-none">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Ver Sacola (<span id="qtd-itens">0</span>)</span>
      </button>
    </div>
  </footer>

  <!-- MODAL: Montar Copo & Escolher Complementos -->
  <div id="modal-produto" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <h2 class="text-lg font-black text-[#5c1380]" id="modal-prod-nome">Nome do Açaí</h2>
          <p class="text-xs text-gray-500 mt-0.5" id="modal-prod-desc">Descrição</p>
        </div>
        <button onclick="fecharModalProduto()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <!-- Seção de Complementos / Adicionais -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-sm font-bold text-gray-800">Deseja adicionar Complementos?</h3>
          <span class="text-[11px] bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full font-semibold">Opcional</span>
        </div>
        <p class="text-xs text-gray-500 mb-3">Selecione frutas, caldas e coberturas especiais para o seu açaí:</p>
        
        <div class="space-y-2" id="lista-adicionais-modal">
          <!-- Complementos carregados via JS -->
        </div>
      </div>

      <!-- Observação do Copo -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Alguma observação para este item?</label>
        <input type="text" id="modal-prod-obs" class="w-full border border-gray-300 rounded-xl p-2.5 text-xs outline-purple-600" placeholder="Ex: Caprichar no leite em pó, sem granola...">
      </div>

      <!-- Total do Copo + Botão de Adicionar à Sacola -->
      <div class="pt-2 border-t flex items-center justify-between gap-4">
        <div>
          <p class="text-[11px] text-gray-500">Valor do Item</p>
          <p class="text-lg font-black text-[#5c1380]" id="modal-prod-total">R$ 0,00</p>
        </div>
        <button onclick="confirmarAdicionarItem()" class="flex-1 bg-[#5c1380] hover:bg-purple-900 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 transition text-sm">
          Adicionar ao Pedido
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: Finalizar Pedido (Checkout) -->
  <div id="modal-checkout" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="text-lg font-black text-gray-900 flex items-center gap-2">
          <i class="fa-solid fa-receipt text-[#5c1380]"></i> Finalizar Pedido
        </h2>
        <button onclick="fecharModalCheckout()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div id="itens-carrinho" class="divide-y divide-gray-100 text-sm max-h-48 overflow-y-auto pr-1"></div>

      <div class="bg-purple-50/70 p-3.5 rounded-xl space-y-1.5 text-sm border border-purple-100">
        <div class="flex justify-between text-gray-600">
          <span>Subtotal:</span>
          <span id="resumo-subtotal" class="font-semibold">R$ 0,00</span>
        </div>
        <div class="flex justify-between text-gray-600">
          <span>Taxa de Entrega:</span>
          <span id="resumo-taxa" class="font-semibold">R$ 0,00</span>
        </div>
        <div class="flex justify-between font-black text-base text-[#5c1380] border-t border-purple-200/80 pt-2">
          <span>Total Geral:</span>
          <span id="resumo-total">R$ 0,00</span>
        </div>
      </div>

      <form id="form-pedido" class="space-y-3" onsubmit="enviarPedido(event)">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Seu Nome *</label>
          <input type="text" id="cliente-nome" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-purple-600" placeholder="Ex: Maria Santos">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Endereço de Entrega (Rua, Nº e Bairro) *</label>
          <input type="text" id="cliente-endereco" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-purple-600" placeholder="Ex: Rua São Domingos, 120">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Forma de Pagamento *</label>
          <select id="forma-pagamento" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-purple-600">
            <option value="Pix">Pix (Chave informada no WhatsApp)</option>
            <option value="Cartão de Crédito">Cartão de Crédito (Levar maquininha)</option>
            <option value="Cartão de Débito">Cartão de Débito (Levar maquininha)</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Observações Gerais para a Entrega</label>
          <textarea id="cliente-obs" rows="2" class="w-full border border-gray-300 rounded-xl p-2 text-sm outline-purple-600" placeholder="Ex: Troco para R$ 50, tocar campainha..."></textarea>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition">
          <i class="fa-brands fa-whatsapp text-xl"></i>
          <span>Confirmar e Enviar Pedido</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    let config = {
      whatsapp: "5516981065241",
      taxaEntrega: 10.00
    };

    // Categorias com a nova aba "Complementos"
    const categorias = [
      "Todos", 
      "Copos Açaí Puro", 
      "Copos Moranguete", 
      "Copo Açaí Tradicional", 
      "Copos Kids", 
      "Ninho c/ Creme de Avelã",
      "Complementos"
    ];
    let categoriaAtiva = "Todos";

    // Lista de Complementos solicitados
    const complementosDisponiveis = [
      { id: "c1", nome: "Morango", preco: 5.00 },
      { id: "c2", nome: "Banana", preco: 2.00 },
      { id: "c3", nome: "Uva", preco: 3.00 },
      { id: "c4", nome: "Leite Condensado", preco: 3.00 },
      { id: "c5", nome: "Leite em Pó", preco: 3.00 }
    ];

    // Cardápio Completo
    const produtos = [
      {
        id: 1,
        categoria: "Copos Açaí Puro",
        nome: "Copo Açaí Puro P - Monte o Seu",
        desc: "Açaí Puro 300ml - Servido com açaí puro. Adicione seus complementos favoritos.",
        preco: 18.40,
        imagem: "puro.png",
        icone: "🍇",
        permiteComplementos: true
      },
      {
        id: 2,
        categoria: "Copos Açaí Puro",
        nome: "Copo Açaí Puro M - Monte o Seu",
        desc: "Açaí Puro 500ml - Servido com açaí puro. Adicione seus complementos favoritos.",
        preco: 27.99,
        imagem: "puro.png",
        icone: "🍇",
        permiteComplementos: true
      },
      {
        id: 3,
        categoria: "Copos Moranguete",
        nome: "Copo Moranguete P",
        desc: "Copo 300ml - Servido com açaí, creme de morango e chocolate moranguete.",
        preco: 22.60,
        imagem: "moranguete.png",
        icone: "🍓",
        permiteComplementos: true
      },
      {
        id: 4,
        categoria: "Copos Moranguete",
        nome: "Copo Moranguete M",
        desc: "Copo 500ml - Servido com açaí, creme de morango e chocolate moranguete.",
        preco: 28.30,
        imagem: "moranguete.png",
        icone: "🍓",
        permiteComplementos: true
      },
      {
        id: 5,
        categoria: "Copo Açaí Tradicional",
        nome: "Copo Açaí Tradicional P",
        desc: "Copo 300ml - Servido com açaí, leite condensado e leite em pó.",
        preco: 19.80,
        imagem: "tradicional.png",
        icone: "🥛",
        permiteComplementos: true
      },
      {
        id: 6,
        categoria: "Copo Açaí Tradicional",
        nome: "Copo Açaí Tradicional M",
        desc: "Copo 500ml - Servido com açaí, leite condensado e leite em pó.",
        preco: 25.70,
        imagem: "tradicional.png",
        icone: "🥛",
        permiteComplementos: true
      },
      {
        id: 7,
        categoria: "Copos Kids",
        nome: "Copo Kids P",
        desc: "Copo 300ml - Servido com açaí, leite condensado, leite em pó e Confete.",
        preco: 24.50,
        imagem: "kids.png",
        icone: "🍬",
        permiteComplementos: true
      },
      {
        id: 8,
        categoria: "Copos Kids",
        nome: "Copo Kids G",
        desc: "Copo 500ml - Servido com açaí, leite condensado, leite em pó e Confete.",
        preco: 34.50,
        imagem: "kids.png",
        icone: "🍬",
        permiteComplementos: true
      },
      {
        id: 9,
        categoria: "Ninho c/ Creme de Avelã",
        nome: "Copo Ninho Com Creme de Avelã P",
        desc: "Copo 300ml - Servido com açaí, creme de avelã e creme de Ninho.",
        preco: 29.50,
        imagem: "ninho avela.png",
        icone: "🍫",
        permiteComplementos: true
      },
      {
        id: 10,
        categoria: "Ninho c/ Creme de Avelã",
        nome: "Copo Ninho com Creme de Avelã M",
        desc: "Copo 500ml - Servido com açaí, creme de avelã e creme de Ninho.",
        preco: 39.15,
        imagem: "ninho avela.png",
        icone: "🍫",
        permiteComplementos: true
      },
      // Complementos como itens avulsos na categoria
      {
        id: 101,
        categoria: "Complementos",
        nome: "Porção Extra de Morango",
        desc: "Pote adicional com morangos frescos picados.",
        preco: 5.00,
        icone: "🍓",
        permiteComplementos: false
      },
      {
        id: 102,
        categoria: "Complementos",
        nome: "Porção Extra de Banana",
        desc: "Pote adicional com banana fresca fatiada.",
        preco: 2.00,
        icone: "🍌",
        permiteComplementos: false
      },
      {
        id: 103,
        categoria: "Complementos",
        nome: "Porção Extra de Uva",
        desc: "Pote adicional de uvas frescas sem semente.",
        preco: 3.00,
        icone: "🍇",
        permiteComplementos: false
      },
      {
        id: 104,
        categoria: "Complementos",
        nome: "Porção Extra de Leite Condensado",
        desc: "Dose extra de leite condensado Moça/Piracanjuba.",
        preco: 3.00,
        icone: "🥛",
        permiteComplementos: false
      },
      {
        id: 105,
        categoria: "Complementos",
        nome: "Porção Extra de Leite em Pó",
        desc: "Dose extra de leite em pó integral.",
        preco: 3.00,
        icone: "🥄",
        permiteComplementos: false
      }
    ];

    let carrinho = []; // Array de itens para permitir copos iguais com adicionais diferentes
    let produtoEmEdicao = null;

    function renderizarCategorias() {
      const container = document.getElementById('lista-categorias');
      container.innerHTML = categorias.map(cat => `
        <button onclick="selecionarCategoria('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${categoriaAtiva === cat ? 'bg-[#5c1380] text-white shadow-sm' : 'bg-white text-gray-600 border border-purple-100 hover:bg-purple-50'}">
          ${cat}
        </button>
      `).join('');
    }

    function selecionarCategoria(cat) {
      categoriaAtiva = cat;
      renderizarCategorias();
      carregarProdutos();
    }

    function carregarProdutos() {
      const container = document.getElementById('lista-produtos');
      const filtrados = categoriaAtiva === "Todos" 
        ? produtos 
        : produtos.filter(p => p.categoria.trim().toLowerCase() === categoriaAtiva.trim().toLowerCase());

      container.innerHTML = filtrados.map(prod => `
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-purple-100 flex gap-3.5 items-center cursor-pointer hover:border-purple-300 transition" onclick="iniciarAdicaoProduto(${prod.id})">
          <div class="w-20 h-20 rounded-xl overflow-hidden bg-purple-50 flex items-center justify-center flex-shrink-0 border border-purple-100">
            ${prod.imagem ? `
              <img src="${encodeURI(prod.imagem)}" alt="${prod.nome}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
              <span style="display:none;" class="w-full h-full text-3xl items-center justify-center">${prod.icone}</span>
            ` : `
              <span class="w-full h-full text-3xl flex items-center justify-center">${prod.icone}</span>
            `}
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="font-bold text-gray-900 text-sm leading-snug">${prod.nome}</h3>
            <p class="text-xs text-gray-500 mt-0.5 line-clamp-2 leading-relaxed">${prod.desc}</p>
            <div class="flex items-center justify-between mt-2">
              <span class="font-black text-[#5c1380] text-sm">R$ ${prod.preco.toFixed(2).replace('.', ',')}</span>
              <button onclick="event.stopPropagation(); iniciarAdicaoProduto(${prod.id})" class="bg-purple-50 hover:bg-purple-100 text-[#5c1380] font-bold px-3 py-1.5 rounded-lg border border-purple-200 text-xs active:scale-95 transition">
                + Adicionar
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Abertura do modal de complementos
    function iniciarAdicaoProduto(id) {
      const prod = produtos.find(p => p.id === id);
      if (!prod) return;

      produtoEmEdicao = { ...prod, complementosEscolhidos: [], obs: "" };

      // Se for apenas porção avulsa (categoria complementos), vai direto para o carrinho
      if (!prod.permiteComplementos) {
        carrinho.push({
          cartId: Date.now() + Math.random(),
          produtoId: prod.id,
          nome: prod.nome,
          precoBase: prod.preco,
          complementos: [],
          obs: "",
          precoTotal: prod.preco,
          qtd: 1
        });
        atualizarBarra();
        return;
      }

      document.getElementById('modal-prod-nome').innerText = prod.nome;
      document.getElementById('modal-prod-desc').innerText = prod.desc;
      document.getElementById('modal-prod-obs').value = "";

      const container = document.getElementById('lista-adicionais-modal');
      container.innerHTML = complementosDisponiveis.map(comp => `
        <label class="flex items-center justify-between p-2.5 rounded-xl border border-gray-200 hover:border-purple-300 bg-gray-50/50 cursor-pointer text-sm">
          <div class="flex items-center gap-2.5">
            <input type="checkbox" value="${comp.id}" onchange="toggleComplementoModal('${comp.id}')" class="w-4 h-4 text-purple-700 rounded focus:ring-purple-500">
            <span class="font-medium text-gray-800">${comp.nome}</span>
          </div>
          <span class="font-bold text-xs text-purple-900">+ R$ ${comp.preco.toFixed(2).replace('.', ',')}</span>
        </label>
      `).join('');

      atualizarTotalModal();
      document.getElementById('modal-produto').classList.remove('hidden');
    }

    function toggleComplementoModal(compId) {
      const index = produtoEmEdicao.complementosEscolhidos.findIndex(c => c.id === compId);
      if (index >= 0) {
        produtoEmEdicao.complementosEscolhidos.splice(index, 1);
      } else {
        const comp = complementosDisponiveis.find(c => c.id === compId);
        if (comp) produtoEmEdicao.complementosEscolhidos.push(comp);
      }
      atualizarTotalModal();
    }

    function atualizarTotalModal() {
      let total = produtoEmEdicao.preco;
      produtoEmEdicao.complementosEscolhidos.forEach(c => total += c.preco);
      document.getElementById('modal-prod-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    function fecharModalProduto() {
      document.getElementById('modal-produto').classList.add('hidden');
      produtoEmEdicao = null;
    }

    function confirmarAdicionarItem() {
      if (!produtoEmEdicao) return;

      let totalItem = produtoEmEdicao.preco;
      produtoEmEdicao.complementosEscolhidos.forEach(c => totalItem += c.preco);

      carrinho.push({
        cartId: Date.now() + Math.random(),
        produtoId: produtoEmEdicao.id,
        nome: produtoEmEdicao.nome,
        precoBase: produtoEmEdicao.preco,
        complementos: [...produtoEmEdicao.complementosEscolhidos],
        obs: document.getElementById('modal-prod-obs').value.trim(),
        precoTotal: totalItem,
        qtd: 1
      });

      fecharModalProduto();
      atualizarBarra();
    }

    function alterarQtd(cartId, delta) {
      const item = carrinho.find(i => i.cartId === cartId);
      if (!item) return;
      item.qtd += delta;
      if (item.qtd <= 0) {
        carrinho = carrinho.filter(i => i.cartId !== cartId);
      }
      atualizarBarra();
      renderizarItensCheckout();
    }

    function calcularTotais() {
      let subtotal = 0;
      let totalQtd = 0;
      carrinho.forEach(item => {
        subtotal += item.precoTotal * item.qtd;
        totalQtd += item.qtd;
      });
      const total = subtotal > 0 ? (subtotal + config.taxaEntrega) : 0;
      return { subtotal, total, totalQtd };
    }

    function atualizarBarra() {
      const { subtotal, totalQtd } = calcularTotais();
      document.getElementById('total-barra').innerText = `R$ ${subtotal.toFixed(2).replace('.', ',')}`;
      document.getElementById('qtd-itens').innerText = totalQtd;
      document.getElementById('btn-sacola').disabled = totalQtd === 0;
    }

    function renderizarItensCheckout() {
      const { subtotal, total } = calcularTotais();
      const container = document.getElementById('itens-carrinho');
      
      const itensHtml = carrinho.map(item => {
        const complTexto = item.complementos.length > 0 
          ? `<p class="text-[11px] text-purple-700 font-medium mt-0.5">+ ${item.complementos.map(c => c.nome).join(', ')}</p>` 
          : '';
        const obsTexto = item.obs 
          ? `<p class="text-[11px] text-gray-500 italic">Obs: ${item.obs}</p>` 
          : '';

        return `
          <div class="flex justify-between items-center py-2.5">
            <div class="pr-2 flex-1">
              <p class="font-bold text-gray-800 text-sm leading-tight">${item.nome}</p>
              ${complTexto}
              ${obsTexto}
              <p class="text-xs text-gray-500 mt-0.5">R$ ${item.precoTotal.toFixed(2).replace('.', ',')} cada</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="alterarQtd(${item.cartId}, -1)" class="w-6 h-6 rounded bg-gray-100 hover:bg-gray-200 font-bold text-gray-700 text-sm flex items-center justify-center">-</button>
              <span class="font-bold text-sm w-4 text-center">${item.qtd}</span>
              <button onclick="alterarQtd(${item.cartId}, 1)" class="w-6 h-6 rounded bg-gray-100 hover:bg-gray-200 font-bold text-gray-700 text-sm flex items-center justify-center">+</button>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = itensHtml || '<p class="text-center py-4 text-gray-400 text-sm">Sua sacola está vazia</p>';
      document.getElementById('resumo-subtotal').innerText = `R$ ${subtotal.toFixed(2).replace('.', ',')}`;
      document.getElementById('resumo-taxa').innerText = `R$ ${config.taxaEntrega.toFixed(2).replace('.', ',')}`;
      document.getElementById('resumo-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    function abrirModalCheckout() {
      renderizarItensCheckout();
      document.getElementById('modal-checkout').classList.remove('hidden');
    }

    function fecharModalCheckout() {
      document.getElementById('modal-checkout').classList.add('hidden');
    }

    function abrirConfig() {
      const novoZap = prompt("Digite seu WhatsApp com DDD (somente números, ex: 5516999999999):", config.whatsapp);
      if (novoZap) config.whatsapp = novoZap.replace(/\D/g, '');
      const novaTaxa = prompt("Digite o valor da taxa de entrega padrão (ex: 5.00):", config.taxaEntrega);
      if (novaTaxa) config.taxaEntrega = parseFloat(novaTaxa) || 0;
      atualizarBarra();
    }

    function enviarPedido(e) {
      e.preventDefault();
      const nome = document.getElementById('cliente-nome').value.trim();
      const endereco = document.getElementById('cliente-endereco').value.trim();
      const pagamento = document.getElementById('forma-pagamento').value;
      const obsGeral = document.getElementById('cliente-obs').value.trim();
      const { subtotal, total } = calcularTotais();

      let texto = `*🍇 NOVO PEDIDO - AÇAIZEIRO*\n\n`;
      texto += `*Cliente:* ${nome}\n`;
      texto += `*Endereço:* ${endereco}\n`;
      texto += `*Pagamento:* ${pagamento}\n`;
      if (obsGeral) texto += `*Obs Entrega:* ${obsGeral}\n`;
      texto += `\n*📋 ITENS SOLICITADOS:*\n`;

      carrinho.forEach(item => {
        const sub = item.precoTotal * item.qtd;
        texto += `\n• *${item.qtd}x ${item.nome}* — R$ ${sub.toFixed(2).replace('.', ',')}\n`;
        if (item.complementos.length > 0) {
          item.complementos.forEach(c => {
            texto += `   └ + ${c.nome} (R$ ${c.preco.toFixed(2).replace('.', ',')})\n`;
          });
        }
        if (item.obs) {
          texto += `   └ Obs item: ${item.obs}\n`;
        }
      });

      texto += `\n*Subtotal:* R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
      texto += `*Taxa de Entrega:* R$ ${config.taxaEntrega.toFixed(2).replace('.', ',')}\n`;
      texto += `*TOTAL DO PEDIDO:* R$ ${total.toFixed(2).replace('.', ',')}\n`;

      const linkWhatsapp = `https://wa.me/${config.whatsapp}?text=${encodeURIComponent(texto)}`;
      window.open(linkWhatsapp, '_blank');
    }

    renderizarCategorias();
    carregarProdutos();
  </script>
</body>
</html>
