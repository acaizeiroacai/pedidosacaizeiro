<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Açaizeiro - Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url("https://db.onlinewebfonts.com/c/20e48b2ec8c64b2a1ceb5b28d9bcc9d0?family=Bryndan+Write");

    .fonte-bryndan {
      font-family: "Bryndan Write", cursive, sans-serif;
      letter-spacing: 1px;
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#fcfaff] text-gray-800 pb-28 antialiased">

  <!-- Topo -->
  <header class="bg-[#411564] text-white p-4 shadow-md sticky top-0 z-30">
    <div class="max-w-xl mx-auto flex items-center gap-3">
      <div class="w-16 h-16 rounded-full bg-black flex items-center justify-center overflow-hidden border-2 border-purple-300 shadow-md flex-shrink-0">
        <img src="LOGO2.png" alt="Açaizeiro" class="w-full h-full object-contain p-0.5" onerror="this.onerror=null; this.src='LOGOO PNG.png';">
      </div>
      <div>
        <h1 class="fonte-bryndan text-2xl font-bold tracking-wider leading-tight text-white drop-shadow-sm">AÇAIZEIRO</h1>
        <p class="text-xs text-purple-200 flex items-center gap-1.5 font-medium">
          <span class="w-2 h-2 rounded-full bg-green-400 inline-block animate-pulse"></span> Aberto para Pedidos
        </p>
      </div>
    </div>
  </header>

  <!-- Filtro de Categorias -->
  <nav class="max-w-xl mx-auto px-4 pt-4 pb-2 sticky top-[80px] bg-[#fcfaff]/95 backdrop-blur-sm z-20">
    <div class="flex gap-2 overflow-x-auto hide-scrollbar py-1" id="lista-categorias"></div>
  </nav>

  <!-- Lista de Itens -->
  <main class="max-w-xl mx-auto p-4 space-y-3" id="lista-produtos"></main>

  <!-- Barra Fixa Inferior (Sacola) -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-purple-100 p-3.5 shadow-2xl z-30">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-[11px] text-gray-500 uppercase font-semibold">Total do Pedido</p>
        <p class="text-xl font-black text-[#411564]" id="total-barra">R$ 0,00</p>
      </div>
      <button onclick="abrirModalCheckout()" id="btn-sacola" class="bg-[#411564] hover:bg-purple-900 active:scale-95 text-white font-bold px-5 py-3 rounded-xl flex items-center gap-2.5 shadow-md transition disabled:opacity-40 disabled:pointer-events-none">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Ver Sacola (<span id="qtd-itens">0</span>)</span>
      </button>
    </div>
  </footer>

  <!-- MODAL: Montar Copo & Escolher Complementos -->
  <div id="modal-produto" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <h2 class="text-lg font-black text-[#411564]" id="modal-prod-nome">Nome do Açaí</h2>
          <p class="text-xs text-gray-500 mt-0.5" id="modal-prod-desc">Descrição</p>
        </div>
        <button onclick="fecharModalProduto()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <!-- Seção de Complementos / Adicionais -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-sm font-bold text-gray-800">Deseja adicionar Complementos?</h3>
          <span class="text-[11px] bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full font-semibold">Opcional</span>
        </div>
        <p class="text-xs text-gray-500 mb-3">Selecione frutas, caldas e coberturas especiais para o seu açaí:</p>
        <div class="space-y-2" id="lista-adicionais-modal"></div>
      </div>

      <!-- Observação do Copo -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Alguma observação para este item?</label>
        <input type="text" id="modal-prod-obs" class="w-full border border-gray-300 rounded-xl p-2.5 text-xs outline-purple-600" placeholder="Ex: Caprichar no leite em pó, sem granola...">
      </div>

      <!-- Total do Copo + Botão de Adicionar à Sacola -->
      <div class="pt-2 border-t flex items-center justify-between gap-4">
        <div>
          <p class="text-[11px] text-gray-500">Valor do Item</p>
          <p class="text-lg font-black text-[#411564]" id="modal-prod-total">R$ 0,00</p>
        </div>
        <button onclick="confirmarAdicionarItem()" class="flex-1 bg-[#411564] hover:bg-purple-900 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 transition text-sm">
          Adicionar ao Pedido
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: Finalizar Pedido (Checkout) -->
  <div id="modal-checkout" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="text-lg font-black text-gray-900 flex items-center gap-2">
          <i class="fa-solid fa-receipt text-[#411564]"></i> Finalizar Pedido
        </h2>
        <button onclick="fecharModalCheckout()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div id="itens-carrinho" class="divide-y divide-gray-100 text-sm max-h-48 overflow-y-auto pr-1"></div>

      <div class="bg-purple-50/70 p-3.5 rounded-xl space-y-1.5 text-sm border border-purple-100">
        <div class="flex justify-between text-gray-600">
          <span>Subtotal:</span>
          <span id="resumo-subtotal" class="font-semibold">R$ 0,00</span>
        </div>
        <div class="flex justify-between text-gray-600">
          <span>Taxa de Entrega:</span>
          <span id="resumo-taxa" class="font-semibold">R$ 0,00</span>
        </div>
        <div class="flex justify-between font-black text-base text-[#411564] border-t border-purple-200/80 pt-2">
          <span>Total Geral:</span>
          <span id="resumo-total">R$ 0,00</span>
        </div>
      </div>

      <form id="form-pedido" class="space-y-3" onsubmit="enviarPedido(event)">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Seu Nome *</label>
          <input type="text" id="cliente-nome" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-purple-600" placeholder="Ex: Maria Santos">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Endereço de Entrega (Rua, Nº e Bairro) *</label>
          <input type="text" id="cliente-endereco" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-purple-600" placeholder="Ex: Rua São Domingos, 120">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Forma de Pagamento *</label>
          <select id="forma-pagamento" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-purple-600">
            <option value="Pix">Pix (Chave informada no WhatsApp)</option>
            <option value="Cartão de Crédito">Cartão de Crédito (Levar maquininha)</option>
            <option value="Cartão de Débito">Cartão de Débito (Levar maquininha)</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Observações Gerais para a Entrega</label>
          <textarea id="cliente-obs" rows="2" class="w-full border border-gray-300 rounded-xl p-2 text-sm outline-purple-600" placeholder="Ex: Troco para R$ 50, tocar campainha..."></textarea>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition">
          <i class="fa-brands fa-whatsapp text-xl"></i>
          <span>Confirmar e Enviar Pedido</span>
        </button>
      </form>
    </div>
  </div>

  <script>

    var categorias = [

      "Complementos"
    ];
    var categoriaAtiva = "Todos";

    function normalizarCategoria(cat) {
      if (!cat) return "Copos Açaí Tradicional";
      var c = cat.trim().toLowerCase();
      if (c.indexOf("puro") !== -1) return "Copos Açaí Puro";
      if (c.indexOf("moranguete") !== -1) return "Copos Moranguete";
      if (c.indexOf("traciona") !== -1 || c.indexOf("tradicional") !== -1) return "Copos Açaí Tradicional";
      if (c.indexOf("kids") !== -1) return "Copos Kids";
      if (c.indexOf("ninho") !== -1 || c.indexOf("avel") !== -1) return "Copos Ninho c/ Creme de Avelã";
      if (c.indexOf("complement") !== -1 || c.indexOf("extra") !== -1 || c.indexOf("adicional") !== -1) return "Complementos";
      return cat;
    }

      }
    ];

    var carrinho = [];
    var produtoEmEdicao = null;

    function renderizarCategorias() {
      var container = document.getElementById('lista-categorias');
      if (!container) return;
      container.innerHTML = categorias.map(function(cat) {
        var ativo = categoriaAtiva === cat;
        var classeCor = ativo ? 'bg-[#411564] text-white shadow-sm' : 'bg-white text-gray-600 border border-purple-100 hover:bg-purple-50';
        return '<button onclick="selecionarCategoria(\'' + cat + '\')" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ' + classeCor + '">' + cat + '</button>';
      }).join('');
    }

    function selecionarCategoria(cat) {
      categoriaAtiva = cat;
      renderizarCategorias();
      carregarProdutos();
    }

    function carregarProdutos() {
      var container = document.getElementById('lista-produtos');
      if (!container) return;

      var filtrados = produtos.filter(function(p) {
        if (categoriaAtiva === "Todos") return true;
        return normalizarCategoria(p.categoria) === categoriaAtiva;
      });

      if (filtrados.length === 0) {
        container.innerHTML = '<p class="text-center py-8 text-gray-400 text-sm">Nenhum produto encontrado nesta categoria.</p>';
        return;
      }

      container.innerHTML = filtrados.map(function(prod) {
        var imgHtml = prod.imagem 
          ? '<img src="' + encodeURI(prod.imagem) + '" alt="' + prod.nome + '" class="w-full h-full object-cover" onerror="this.onerror=null; this.src=\'PURO.png\';">'
          : '<div class="w-full h-full flex items-center justify-center font-black text-purple-300 text-xs text-center p-1">EXTRA</div>';

        return '<div class="bg-white p-3.5 rounded-2xl shadow-sm border border-purple-100 flex gap-3.5 items-center cursor-pointer hover:border-purple-300 transition" onclick="iniciarAdicaoProduto(' + (typeof prod.id === "string" ? "'" + prod.id + "'" : prod.id) + ')">' +
          '<div class="w-20 h-20 rounded-xl overflow-hidden bg-purple-50 flex-shrink-0 border border-purple-100">' + imgHtml + '</div>' +
          '<div class="flex-1 min-w-0">' +
            '<h3 class="font-bold text-gray-900 text-sm leading-snug">' + prod.nome + '</h3>' +
            '<p class="text-xs text-gray-500 mt-0.5 line-clamp-2 leading-relaxed">' + prod.desc + '</p>' +
            '<div class="flex items-center justify-between mt-2">' +
              '<span class="font-black text-[#5c1380] text-sm">R$ ' + Number(prod.preco || 0).toFixed(2).replace('.', ',') + '</span>' +
              '<button onclick="event.stopPropagation(); iniciarAdicaoProduto(' + (typeof prod.id === "string" ? "'" + prod.id + "'" : prod.id) + ')" class="bg-purple-50 hover:bg-purple-100 text-[#411564] font-bold px-3 py-1.5 rounded-lg border border-purple-200 text-xs active:scale-95 transition">+ Adicionar</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function iniciarAdicaoProduto(id) {
      var prod = produtos.find(function(p) { return String(p.id) === String(id); });
      if (!prod) return;

      produtoEmEdicao = Object.assign({}, prod, { complementosEscolhidos: [] });

      if (!prod.permiteComplementos) {
        carrinho.push({
          cartId: Date.now() + Math.random(),
          produtoId: prod.id,
          nome: prod.nome,
          precoBase: prod.preco,
          complementos: [],
          obs: "",
          precoTotal: prod.preco,
          qtd: 1
        });
        atualizarBarra();
        return;
      }

      document.getElementById('modal-prod-nome').innerText = prod.nome;
      document.getElementById('modal-prod-desc').innerText = prod.desc;
      document.getElementById('modal-prod-obs').value = "";

      var container = document.getElementById('lista-adicionais-modal');
      container.innerHTML = complementosDisponiveis.map(function(comp) {
        return '<label class="flex items-center justify-between p-2.5 rounded-xl border border-gray-200 hover:border-purple-300 bg-gray-50/50 cursor-pointer text-sm">' +
          '<div class="flex items-center gap-2.5">' +
            '<input type="checkbox" value="' + comp.id + '" onchange="toggleComplementoModal(\'' + comp.id + '\')" class="w-4 h-4 text-purple-700 rounded focus:ring-purple-500">' +
            '<span class="font-medium text-gray-800">' + comp.nome + '</span>' +
          '</div>' +
          '<span class="font-bold text-xs text-purple-900">+ R$ ' + Number(comp.preco || 0).toFixed(2).replace('.', ',') + '</span>' +
        '</label>';
      }).join('');

      atualizarTotalModal();
      document.getElementById('modal-produto').classList.remove('hidden');
    }

    function toggleComplementoModal(compId) {
      var index = produtoEmEdicao.complementosEscolhidos.findIndex(function(c) { return String(c.id) === String(compId); });
      if (index >= 0) {
        produtoEmEdicao.complementosEscolhidos.splice(index, 1);
      } else {
        var comp = complementosDisponiveis.find(function(c) { return String(c.id) === String(compId); });
        if (comp) produtoEmEdicao.complementosEscolhidos.push(comp);
      }
      atualizarTotalModal();
    }

    function atualizarTotalModal() {
      var total = produtoEmEdicao.preco;
      produtoEmEdicao.complementosEscolhidos.forEach(function(c) { total += c.preco; });
      document.getElementById('modal-prod-total').innerText = 'R$ ' + total.toFixed(2).replace('.', ',');
    }

    function fecharModalProduto() {
      document.getElementById('modal-produto').classList.add('hidden');
      produtoEmEdicao = null;
    }

    function confirmarAdicionarItem() {
      if (!produtoEmEdicao) return;

      var totalItem = produtoEmEdicao.preco;
      produtoEmEdicao.complementosEscolhidos.forEach(function(c) { totalItem += c.preco; });

      carrinho.push({
        cartId: Date.now() + Math.random(),
        produtoId: produtoEmEdicao.id,
        nome: produtoEmEdicao.nome,
        precoBase: produtoEmEdicao.preco,
        complementos: produtoEmEdicao.complementosEscolhidos.slice(),
        obs: document.getElementById('modal-prod-obs').value.trim(),
        precoTotal: totalItem,
        qtd: 1
      });

      fecharModalProduto();
      atualizarBarra();
    }

    function alterarQtd(cartId, delta) {
      var item = carrinho.find(function(i) { return i.cartId === cartId; });
      if (!item) return;
      item.qtd += delta;
      if (item.qtd <= 0) {
        carrinho = carrinho.filter(function(i) { return i.cartId !== cartId; });
      }
      atualizarBarra();
      renderizarItensCheckout();
    }

    function calcularTotais() {
      var subtotal = 0;
      var totalQtd = 0;
      carrinho.forEach(function(item) {
        subtotal += item.precoTotal * item.qtd;
        totalQtd += item.qtd;
      });
      var total = subtotal > 0 ? (subtotal + config.taxaEntrega) : 0;
      return { subtotal: subtotal, total: total, totalQtd: totalQtd };
    }

    function atualizarBarra() {
      var totais = calcularTotais();
      document.getElementById('total-barra').innerText = 'R$ ' + totais.subtotal.toFixed(2).replace('.', ',');
      document.getElementById('qtd-itens').innerText = totais.totalQtd;
      document.getElementById('btn-sacola').disabled = totais.totalQtd === 0;
    }

    function renderizarItensCheckout() {
      var totais = calcularTotais();
      var container = document.getElementById('itens-carrinho');
      
      var itensHtml = carrinho.map(function(item) {
        var complTexto = item.complementos.length > 0 
          ? '<p class="text-[11px] text-purple-700 font-medium mt-0.5">+ ' + item.complementos.map(function(c) { return c.nome; }).join(', ') + '</p>' 
          : '';
        var obsTexto = item.obs 
          ? '<p class="text-[11px] text-gray-500 italic">Obs: ' + item.obs + '</p>' 
          : '';

        return '<div class="flex justify-between items-center py-2.5">' +
          '<div class="pr-2 flex-1">' +
            '<p class="font-bold text-gray-800 text-sm leading-tight">' + item.nome + '</p>' +
            complTexto +
            obsTexto +
            '<p class="text-xs text-gray-500 mt-0.5">R$ ' + item.precoTotal.toFixed(2).replace('.', ',') + ' cada</p>' +
          '</div>' +
          '<div class="flex items-center gap-2">' +
            '<button onclick="alterarQtd(' + item.cartId + ', -1)" class="w-6 h-6 rounded bg-gray-100 hover:bg-gray-200 font-bold text-gray-700 text-sm flex items-center justify-center">-</button>' +
            '<span class="font-bold text-sm w-4 text-center">' + item.qtd + '</span>' +
            '<button onclick="alterarQtd(' + item.cartId + ', 1)" class="w-6 h-6 rounded bg-gray-100 hover:bg-gray-200 font-bold text-gray-700 text-sm flex items-center justify-center">+</button>' +
          '</div>' +
        '</div>';
      }).join('');

      container.innerHTML = itensHtml || '<p class="text-center py-4 text-gray-400 text-sm">Sua sacola está vazia</p>';
      document.getElementById('resumo-subtotal').innerText = 'R$ ' + totais.subtotal.toFixed(2).replace('.', ',');
      document.getElementById('resumo-taxa').innerText = 'R$ ' + config.taxaEntrega.toFixed(2).replace('.', ',');
      document.getElementById('resumo-total').innerText = 'R$ ' + totais.total.toFixed(2).replace('.', ',');
    }

    function abrirModalCheckout() {
      renderizarItensCheckout();
      document.getElementById('modal-checkout').classList.remove('hidden');
    }

    function fecharModalCheckout() {
      document.getElementById('modal-checkout').classList.add('hidden');
    }

    async function enviarPedido(e) {
      e.preventDefault();
      var nome = document.getElementById('cliente-nome').value.trim();
      var endereco = document.getElementById('cliente-endereco').value.trim();
      var pagamento = document.getElementById('forma-pagamento').value;
      var obsGeral = document.getElementById('cliente-obs').value.trim();
      var totais = calcularTotais();

      // Monta o resumo dos itens em formato de objeto para salvar no banco
      var itensParaSalvar = carrinho.map(function(item) {
        return {
          id: item.produtoId,
          nome: item.nome,
          quantidade: item.qtd,
          preco_unitario: item.precoTotal,

        };
      });

      // Tenta gravar o pedido no Supabase em segundo plano
      try {

          var client = window.supabase.createClient(
            "https://sfxvbnxswuvkpssnryjk.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeHZibnhzd3V2a3Bzc25yeWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MjE5OTMsImV4cCI6MjEwOTE5Nzk5M30.lCnXsUM9vzUmDOytZOMNJsOYqkc-pX0zvuVLGHfpkBE"
          );

          await client.from('pedidos').insert([{

            itens: itensParaSalvar,

            taxa_entrega: config.taxaEntrega,
            total: totais.total,
            status: 'Recebido'
          }]);
        }
      } catch (errBanco) {
        console.warn("Falha ao salvar pedido no Supabase, continuando para o WhatsApp:", errBanco);
      }

      // Monta o texto para envio ao WhatsApp
      var texto = '*🍇 NOVO PEDIDO - AÇAIZEIRO*\n\n';
      texto += '*Cliente:* ' + nome + '\n';
      texto += '*Endereço:* ' + endereco + '\n';
      texto += '*Pagamento:* ' + pagamento + '\n';
      if (obsGeral) texto += '*Obs Entrega:* ' + obsGeral + '\n';
      texto += '\n*📋 ITENS SOLICITADOS:*\n';

      carrinho.forEach(function(item) {
        var sub = item.precoTotal * item.qtd;
        texto += '\n• *' + item.qtd + 'x ' + item.nome + '* — R$ ' + sub.toFixed(2).replace('.', ',') + '\n';
        if (item.complementos.length > 0) {

      texto += '*Taxa de Entrega:* R$ ' + config.taxaEntrega.toFixed(2).replace('.', ',') + '\n';
      texto += '*TOTAL DO PEDIDO:* R$ ' + totais.total.toFixed(2).replace('.', ',') + '\n';

      var linkWhatsapp = 'https://wa.me/' + config.whatsapp + '?text=' + encodeURIComponent(texto);

    }

    // 1. RENDERIZAÇÃO IMEDIATA (Exibe produtos e adicionais padrão instantaneamente)
    renderizarCategorias();
    carregarProdutos();

    // 2. SINCRONIZAÇÃO COMPLETA COM O SUPABASE (Copos + Complementos)
    setTimeout(function() {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.onload = function() {
        try {
          var client = window.supabase.createClient(
            "https://sfxvbnxswuvkpssnryjk.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeHZibnhzd3V2a3Bzc25yeWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MjE5OTMsImV4cCI6MjEwOTE5Nzk5M30.lCnXsUM9vzUmDOytZOMNJsOYqkc-pX0zvuVLGHfpkBE"
          );

          Promise.all([
            client.from('CARDAPIO ACAIZEIRO').select('*'),
            client.from('COMPLEMENTOS').select('*').eq('ativo', true)
          ]).then(function(respostas) {
            var resCopos = respostas[0];
            var resComp = respostas[1];

            // 1. Atualiza Copos do Banco
            if (resCopos.data && resCopos.data.length > 0) {
              resCopos.data.forEach(function(item) {
                if (!item.nome) return;

                var catPadrao = normalizarCategoria(item.categoria);
                var existe = produtos.find(function(p) {
                  var pNome = p.nome.toLowerCase().replace(/[^a-z0-9]/g, '');
                  var iNome = item.nome.toLowerCase().replace(/[^a-z0-9]/g, '');
                  return String(p.id) === String(item.id) || pNome === iNome;
                });

                var objProduto = {
                  id: item.id,
                  categoria: catPadrao,
                  nome: item.nome,
                  desc: item.descricao || "",
                  preco: parseFloat(item.preco) || 0,
                  imagem: item.imagem_url || "TRADICIONAL.png",
                  permiteComplementos: catPadrao.toLowerCase() !== "complementos"
                };

                if (existe) {
                  Object.assign(existe, objProduto);
                } else {
                  produtos.push(objProduto);
                }
              });
              renderizarCategorias();
              carregarProdutos();
            }

            // 2. Atualiza Complementos do Banco
            if (resComp.data && resComp.data.length > 0) {
              complementosDisponiveis = resComp.data.map(function(c) {
                return {
                  id: String(c.id),
                  nome: c.nome,
                  preco: parseFloat(c.preco) || 0
                };
              });
            }
          }).catch(function(e) {
            console.warn("Aviso na consulta ao Supabase:", e);
          });
        } catch (err) {
          console.warn("Erro Supabase:", err);
        }
      };
      document.head.appendChild(s);
    }, 800);
  </script>
